[project]
name = "aware-goal-native-fs-adapter"
version = "0.1.0"
description = "Protocol-admitted filesystem provider for read-only native Goal Phase operations."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "aware-goal-operational-runtime>=0.1.0",
  "aware-goal-sdk>=0.3.0",
  "aware-protocol-fs-adapter>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_goal_native_fs_adapter"]
include = ["README.md", "aware_goal_native_fs_adapter/py.typed"]
