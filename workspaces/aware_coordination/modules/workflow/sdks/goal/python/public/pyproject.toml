[project]
name = "aware-goal-sdk"
version = "0.3.0"
description = "Canonical Goal SDK operations with explicitly selected authority providers."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "aware-goal-operational-runtime>=0.1.0",
]

[project.optional-dependencies]
test = [
  "aware-goal-operational-runtime>=0.1.0",
  "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
aware-goal-operational-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["aware_goal_sdk"]
include = ["README.md", "aware_goal_sdk/py.typed"]
