[project]
name = "aware-issue-cli"
version = "0.8.1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Thin command-line projection of canonical Aware Issue SDK operations."
requires-python = ">=3.12"
dependencies = [
  "aware-command-runtime>=0.1.1,<0.2.0",
  "aware-issue-fs-adapter>=0.9.2,<0.10.0",
  "aware-issue-sdk>=0.10.2,<0.11.0",
  "aware-workspace-sdk[publication]>=0.2.0,<0.3.0",
]

[project.scripts]
aware-issue-cli = "aware_issue_cli.main:main"

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_issue_cli"]
include = ["README.md", "aware_issue_cli/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
aware-command-runtime = { path = "../../../../../../../aware_kernel/libs/command_runtime/python", editable = true }
aware-issue-fs-adapter = { workspace = true }
aware-issue-sdk = { workspace = true }
