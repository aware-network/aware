[project]
name = "aware-issue-sdk"
version = "0.10.3"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Canonical Issue SDK operations with explicitly selected authority providers."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-issue-runtime>=0.3.0,<0.4.0",
  "aware-issue-operational-runtime>=0.3.2,<0.4.0",
  "aware-file-system>=0.3.1,<0.4.0",
  "pydantic>=2.8.0,<3.0.0",
]

[tool.uv.sources]
aware-file-system = { path = "../../../../../../aware_kernel/modules/filesystem/libs/file_system/python", editable = true }
aware-issue-runtime = { workspace = true }

[project.optional-dependencies]
source_projection = [
  "aware-issue-operational-runtime[source_projection]>=0.3.2,<0.4.0",
  "aware-issue-fs-adapter>=0.9.3,<0.10.0",
  "aware-workspace-sdk[source_projection]>=0.2.2,<0.3.0",
]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_issue_sdk"]
include = ["README.md", "aware_issue_sdk/py.typed"]
