[project]
name = "aware-issue-operational-runtime"
version = "0.3.1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Materialization-independent Workflow Issue operation authority for Aware."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AWARE Team" }]
dependencies = [
  "aware-issue-sdk>=0.10.2,<0.11.0",
  "aware-workspace-sdk>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_issue_operational_runtime"]
include = ["aware_issue_operational_runtime/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
