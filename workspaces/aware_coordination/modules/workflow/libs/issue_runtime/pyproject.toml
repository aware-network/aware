[project]
name = "aware-issue-runtime"
version = "0.3.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Generated-free structured Issue projection runtime for Aware Coordination."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AWARE Team" }]
dependencies = [
  "aware-issue-operational-runtime>=0.1.0",
]

[tool.uv.sources]
aware-issue-operational-runtime = { workspace = true }

[project.optional-dependencies]
test = [
  "pytest>=8.2.0,<10.0.0",
  "pytest-asyncio>=0.23.7,<2.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_issue_runtime"]
include = ["README.md", "aware_issue_runtime/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
