[project]
name = "aware-project-goal-fs-adapter"
version = "0.1.1"
description = "Original-owner Project and Proposed Goal filesystem customer composition."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-project-runtime>=0.1.0,<0.2.0",
  "aware-goal-operational-runtime>=0.1.0,<0.2.0",
  "aware-protocol-fs-adapter>=0.6.5,<0.7.0",
  "aware-workspace-sdk>=0.2.11,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.10,<0.2.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# Keep original canonical sources, class identities and verifier registries.
# The broad aware-workflow wheel excludes these exact namespace-fragment files.
[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.wheel]
bypass-selection = true
only-include = ["aware_workflow"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
modules = [
  "project_initial_source.py",
  "project_customer.py",
  "project_initial_membership.py",
  "project_membership_read.py",
  "goal_planning_initial_source.py",
  "goal_planning_initial_intent.py",
  "goal_planning_initial_plan.py",
  "goal_planning_initial_publication.py",
  "goal_planning_initial_read.py",
  "goal_customer.py",
]

# Self-contained source archives rebuild the same fragment without the monorepo.
[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "hatch_build.py", "aware_workflow"]

[tool.uv.sources]
aware-goal-operational-runtime = { workspace = true }
aware-project-runtime = { workspace = true }
