[project]
name = "aware-agent-cli"
version = "0.2.0a14"
description = "Neutral Agent CLI composition over canonical Aware family registrars."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "aware-command-runtime>=0.1.1,<0.2.0",
  "aware-issue-cli>=0.8.0,<0.9.0",
  "aware-protocol-cli[bootstrap,specification-setup]>=0.3.5,<0.4.0",
  "aware-workspace-sdk[preparation,setup,setup_admission,setup_review]>=0.2.11,<0.3.0",
  "aware-workspace-runtime[setup_admission,setup_review]>=0.2.16,<0.3.0",
  "aware-specification-cli[governed]>=0.4.3,<0.5.0",
  "aware-issue-sdk[workspace_setup_admission]>=0.10.6,<0.11.0",
  "aware-issue-fs-adapter>=0.9.6,<0.10.0",
  "aware-protocol-sdk>=0.3.2,<0.4.0",
  "aware-protocol-fs-adapter>=0.6.6,<0.7.0",
  "aware-protocol-runtime>=0.1.1,<0.2.0",
  "aware-specification-sdk>=0.3.3,<0.4.0",
  "aware-specification-fs-sdk-adapter[governed]>=0.4.3,<0.5.0",
  "aware-specification-runtime>=0.1.0,<0.2.0",
]

[project.scripts]
aware = "aware_agent_cli.main:main"

[project.optional-dependencies]
goal = ["aware-goal-native-cli>=0.1.2,<0.2.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_agent_cli"]
include = ["aware_agent_cli/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
