[project]
name = "aware-agent-cli"
version = "0.2.0a3"
description = "Neutral Agent CLI composition over canonical Aware family registrars."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "aware-command-runtime>=0.1.1,<0.2.0",
  "aware-issue-cli>=0.8.0,<0.9.0",
  "aware-protocol-cli[bootstrap,specification-setup]>=0.3.5,<0.4.0",
  "aware-workspace-sdk[preparation]>=0.2.1,<0.3.0",
  "aware-specification-cli[governed]>=0.4.3,<0.5.0",
  "aware-issue-sdk>=0.10.0,<0.11.0",
  "aware-issue-fs-adapter>=0.9.4,<0.10.0",
  "aware-protocol-sdk>=0.3.1,<0.4.0",
  "aware-protocol-fs-adapter>=0.6.4,<0.7.0",
  "aware-protocol-runtime>=0.1.1,<0.2.0",
  "aware-specification-sdk>=0.3.3,<0.4.0",
  "aware-specification-fs-sdk-adapter[governed]>=0.4.3,<0.5.0",
  "aware-specification-runtime>=0.1.0,<0.2.0",
]

[project.scripts]
aware = "aware_agent_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_agent_cli"]
include = ["aware_agent_cli/py.typed"]

[tool.uv.sources]
aware-command-runtime = { path = "../../../../../../aware_kernel/libs/command_runtime/python", editable = true }
aware-issue-cli = { path = "../../../../../../aware_coordination/modules/workflow/sdks/issue/cli/python", editable = true }
aware-protocol-cli = { path = "../../../../../../aware_kernel/modules/protocol/libs/cli/python", editable = true }
aware-specification-cli = { path = "../../../../../../aware_kernel/modules/specification/sdks/specification/python/cli", editable = true }
aware-workspace-sdk = { path = "../../../../../../aware_workspace/modules/workspace/sdks/workspace/python/public", editable = true }
aware-issue-sdk = { path = "../../../../../../aware_coordination/modules/workflow/sdks/issue/python", editable = true }
aware-issue-fs-adapter = { path = "../../../../../../aware_coordination/modules/workflow/sdks/issue/filesystem_adapter/python", editable = true }
aware-protocol-sdk = { path = "../../../../../../aware_kernel/modules/protocol/sdks/protocol/python", editable = true }
aware-protocol-fs-adapter = { path = "../../../../../../aware_kernel/modules/protocol/libs/fs_adapter/python", editable = true }
aware-protocol-runtime = { path = "../../../../../../aware_kernel/modules/protocol/libs/runtime/python", editable = true }
aware-specification-sdk = { path = "../../../../../../aware_kernel/modules/specification/sdks/specification/python/public", editable = true }
aware-specification-fs-sdk-adapter = { path = "../../../../../../aware_kernel/modules/specification/sdks/specification/python/fs_adapter", editable = true }
aware-specification-runtime = { path = "../../../../../../aware_kernel/modules/specification/libs/runtime/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
