[project]
name = "aware-protocol-fs-adapter"
version = "0.6.1"
requires-python = ">=3.12"
dependencies = ["aware-protocol-runtime>=0.1.0", "aware-protocol-sdk>=0.2.0,<0.3.0", "jsonschema>=4.23.0,<5.0.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
draft = ["aware-file-system>=0.3.0,<0.4.0"]
test = ["pytest>=8.4.2,<10.0.0"]
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aware_protocol_fs_adapter"]
