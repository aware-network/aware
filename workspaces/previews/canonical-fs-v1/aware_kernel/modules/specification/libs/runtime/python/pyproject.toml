[project]
name = "aware-specification-runtime"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Dependency-free Kernel Specification contracts and readiness runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.4.2,<10.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_specification_runtime"]
include = ["aware_specification_runtime/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
