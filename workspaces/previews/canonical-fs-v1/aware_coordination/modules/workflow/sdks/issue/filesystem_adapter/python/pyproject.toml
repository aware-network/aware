[project]
name = "aware-issue-fs-adapter"
version = "0.9.1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Filesystem authority provider for canonical Aware Issue SDK operations."
requires-python = ">=3.12"
dependencies = [
  "aware-issue-runtime>=0.3.0,<0.4.0",
  "aware-issue-operational-runtime>=0.3.0,<0.4.0",
  "aware-issue-sdk>=0.10.1,<0.11.0",
  "aware-file-system>=0.3.1,<0.4.0",
  "aware-protocol-fs-adapter>=0.6.0,<0.7.0",
  "aware-workspace-operator>=0.4.0,<0.5.0",
]

[project.optional-dependencies]
specification = ["aware-specification-fs-sdk-adapter>=0.1.0"]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_issue_fs_adapter"]
include = ["README.md", "aware_issue_fs_adapter/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
aware-issue-runtime = { workspace = true }
aware-issue-operational-runtime = { workspace = true }
aware-issue-sdk = { workspace = true }
