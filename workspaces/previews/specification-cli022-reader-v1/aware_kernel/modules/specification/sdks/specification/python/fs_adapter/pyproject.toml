[project]
name = "aware-specification-fs-sdk-adapter"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["aware-specification-sdk>=0.2.0,<0.3.0", "aware-specification-fs-adapter"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
protocol = ["aware-protocol-fs-adapter>=0.3.0,<0.6.0"]
governed = ["aware-protocol-fs-adapter[draft]>=0.5.0,<0.6.0", "aware-issue-sdk>=0.8.0,<0.9.0", "aware-issue-fs-adapter>=0.7.0,<0.8.0", "aware-file-system>=0.2.0,<0.3.0"]
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aware_specification_fs_sdk_adapter"]
