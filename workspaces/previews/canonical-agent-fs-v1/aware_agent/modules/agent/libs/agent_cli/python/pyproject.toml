[project]
name = "aware-agent-cli"
version = "0.2.0a1"
description = "Neutral Agent CLI composition over canonical Aware family registrars."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "aware-command-runtime>=0.1.1,<0.2.0",
  "aware-issue-cli>=0.8.0,<0.9.0",
  "aware-protocol-cli[specification-setup]>=0.3.4,<0.4.0",
  "aware-specification-cli[governed]>=0.4.2,<0.5.0",
]

[project.scripts]
aware = "aware_agent_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_agent_cli"]
include = ["aware_agent_cli/py.typed"]

[tool.uv.sources]
aware-command-runtime = { workspace = true }
aware-issue-cli = { workspace = true }
aware-protocol-cli = { workspace = true }
aware-specification-cli = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
