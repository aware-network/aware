version = 1
description = "Aware source-checkout lint/type gates owned by the Workspace revision."

[defaults]
command = "aware-cli workspace quality-gates"
fail_on_missing_tool = true
run_before_module_proof = true

[defaults.profile_by_language]
python = "standard"
dart = "standard"

[gates.python_flake8]
gate_id = "python.flake8"
language = "python"
command = ["uv", "run", "flake8", "--jobs", "1"]
target_mode = "paths"

[gates.python_mypy]
gate_id = "python.mypy"
language = "python"
command = ["uv", "run", "mypy"]
target_mode = "paths"

[gates.python_basedpyright_error]
gate_id = "python.basedpyright.error"
language = "python"
command = ["uv", "run", "basedpyright", "--level", "error"]
target_mode = "paths"

[gates.python_basedpyright_warning]
gate_id = "python.basedpyright.warning"
language = "python"
command = ["uv", "run", "basedpyright", "--level", "warning", "--warnings"]
target_mode = "paths"

[gates.python_no_getattr_stable_ids_codegen]
gate_id = "python.no_getattr.stable_ids_codegen"
language = "python"
command = [
  "bash",
  "-lc",
  "if rg -n \"getattr\\\\(\" workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/config/render/stable_ids_codegen.py >/dev/null; then echo \"Forbidden getattr() in stable_ids_codegen.py\"; exit 1; fi",
]
target_mode = "none"

[gates.python_no_reflection_ocg_via_oig]
gate_id = "python.no_reflection.ocg_via_oig"
language = "python"
command = [
  "bash",
  "-lc",
  "if rg -n \"getattr\\\\(|hasattr\\\\(\" workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/config/lane workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/instance/scoped_index.py >/dev/null; then echo \"Forbidden reflective lookup in OCG-via-OIG strict lane\"; exit 1; fi",
]
target_mode = "none"

[gates.dart_analyze]
gate_id = "dart.analyze"
language = "dart"
command = ["dart", "analyze"]
target_mode = "paths"

[profiles.python.standard]
gates = ["python.flake8", "python.mypy", "python.basedpyright.error"]

[profiles.python.strict]
gates = ["python.flake8", "python.mypy", "python.basedpyright.warning"]

[profiles.python.meta_renderer_strict]
gates = [
  "python.flake8",
  "python.mypy",
  "python.basedpyright.warning",
  "python.no_getattr.stable_ids_codegen",
]

[profiles.python.meta_ocg_lane_strict]
gates = [
  "python.flake8",
  "python.mypy",
  "python.basedpyright.warning",
  "python.no_reflection.ocg_via_oig",
]

[profiles.dart.standard]
gates = ["dart.analyze"]

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/modules/meta"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/config/render/stable_ids_codegen.py"
profile = "meta_renderer_strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/config/lane"
profile = "meta_ocg_lane_strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/modules/meta/ontology/runtime/python/aware_meta/graph/instance/scoped_index.py"
profile = "meta_ocg_lane_strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_workspace/modules/workspace/libs/language_service_host"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/modules/code"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/languages/aware/grammar"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/languages/python/grammar"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/languages/sql/grammar"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_kernel/languages/dart/grammar"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "libs/environment-artifacts"
profile = "strict"

[[path_profiles]]
language = "python"
path_prefix = "workspaces/aware_network/modules/interface/sdks/aware"
profile = "strict"
