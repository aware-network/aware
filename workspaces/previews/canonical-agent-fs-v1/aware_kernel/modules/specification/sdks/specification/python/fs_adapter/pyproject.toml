[project]
name = "aware-specification-fs-sdk-adapter"
version = "0.4.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Neutral filesystem provider for Specification SDK operations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aware-specification-sdk>=0.3.1,<0.4.0", "aware-specification-fs-adapter"]

[project.optional-dependencies]
protocol = ["aware-protocol-fs-adapter>=0.3.0,<0.7.0"]
governed = [
  "aware-protocol-fs-adapter[draft]>=0.6.1,<0.7.0",
  "aware-issue-sdk>=0.10.1,<0.11.0",
  "aware-issue-fs-adapter>=0.9.1,<0.10.0",
  "aware-file-system>=0.3.1,<0.4.0",
]

[tool.uv.sources]
aware-specification-fs-adapter = { workspace = true }
aware-specification-sdk = { workspace = true }
aware-protocol-fs-adapter = { workspace = true }
aware-issue-sdk = { workspace = true }
aware-issue-fs-adapter = { workspace = true }
aware-file-system = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_specification_fs_sdk_adapter"]
