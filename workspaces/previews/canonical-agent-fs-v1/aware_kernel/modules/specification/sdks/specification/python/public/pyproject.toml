[project]
name = "aware-specification-sdk"
version = "0.3.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Neutral public Specification operation contracts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aware-specification-runtime>=0.1.0,<0.2.0"]

[tool.uv.sources]
aware-specification-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_specification_sdk"]
