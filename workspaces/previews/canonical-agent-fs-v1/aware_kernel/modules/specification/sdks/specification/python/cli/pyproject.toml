[project]
name = "aware-specification-cli"
version = "0.4.2"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Thin neutral filesystem Specification commands."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aware-specification-sdk>=0.3.1,<0.4.0",
    "aware-specification-fs-sdk-adapter[protocol]>=0.4.1,<0.5.0",
    "aware-command-runtime>=0.1.1,<0.2.0",
]

[project.optional-dependencies]
governed = ["aware-specification-fs-sdk-adapter[governed]>=0.4.1,<0.5.0"]

[tool.uv.sources]
aware-specification-fs-sdk-adapter = { workspace = true }
aware-specification-sdk = { workspace = true }
aware-command-runtime = { workspace = true }

[project.scripts]
aware-spec = "aware_specification_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_specification_cli"]
