[project]
name = "aware-issue-fs-adapter"
version = "0.6.0+setup.2"
requires-python = ">=3.12"
dependencies = ["aware-issue-runtime==0.1.0+setup.1", "aware-issue-operational-runtime==0.3.0+setup.1", "aware-issue-sdk==0.7.0+setup.1", "aware-file-system==0.1.5+setup.2", "aware-protocol-fs-adapter>=0.2.0", "aware-workspace-operator>=0.3.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
specification = ["aware-specification-fs-sdk-adapter>=0.1.0"]
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aware_issue_fs_adapter"]
