[project]
name = "aware-protocol-cli"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["aware-protocol-fs-adapter>=0.4.0,<0.5.0", "aware-protocol-sdk>=0.2.0,<0.3.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
specification-setup = ["aware-issue-sdk>=0.7.0,<0.8.0", "aware-issue-fs-adapter>=0.6.0,<0.7.0"]
[project.scripts]
aware-protocol = "aware_protocol_cli.main:main"
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aware_protocol_cli"]
