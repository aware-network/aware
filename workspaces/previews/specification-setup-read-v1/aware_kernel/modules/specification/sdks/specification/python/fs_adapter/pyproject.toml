[project]
name = "aware-specification-fs-sdk-adapter"
version = "0.2.1"
requires-python = ">=3.12"
dependencies = ["aware-specification-sdk", "aware-specification-fs-adapter"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
[project.optional-dependencies]
protocol = ["aware-protocol-fs-adapter>=0.3.0,<0.5.0"]
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aware_specification_fs_sdk_adapter"]
