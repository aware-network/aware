[project]
name = "aware-workspace-sdk"
version = "0.2.15"
description = "Neutral Workspace SDK with explicitly selected original authority providers."
license = "Apache-2.0"
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-workspace-runtime>=0.2.20,<0.3.0",
]

[project.optional-dependencies]
setup_review = [
  "aware-workspace-runtime[setup_review]>=0.2.20,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.12,<0.2.0",
  "aware-issue-sdk[workspace_setup_admission]>=0.10.6,<0.11.0",
]
setup_admission = [
  "aware-workspace-runtime[setup_admission]>=0.2.20,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.12,<0.2.0",
  "aware-issue-sdk[workspace_setup_admission]>=0.10.5,<0.11.0",
]
setup = ["aware-workspace-fs-adapter>=0.1.12,<0.2.0"]
filesystem_delta_capture = ["aware-workspace-fs-adapter>=0.1.12,<0.2.0"]
source_projection = [
  "aware-workspace-runtime[source_projection]>=0.2.20,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.12,<0.2.0",
  "aware-issue-sdk>=0.10.3,<0.11.0",
]
preparation = ["aware-workspace-fs-adapter>=0.1.12,<0.2.0"]
filesystem = ["aware-workspace-fs-adapter>=0.1.12,<0.2.0"]
filesystem_delta_retention = ["aware-workspace-fs-adapter>=0.1.12,<0.2.0"]
publication = [
  "aware-workspace-runtime[publication]>=0.2.20,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.12,<0.2.0",
  "aware-issue-sdk>=0.10.2,<0.11.0",
]
test = [
  "flake8>=7.1.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[tool.uv.sources]
aware-issue-sdk = { path = "../../../../../../../aware_coordination/modules/workflow/sdks/issue/python", editable = true }
aware-workspace-fs-adapter = { workspace = true }
aware-workspace-runtime = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_workspace_sdk"]
include = ["README.md", "aware_workspace_sdk/py.typed"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
