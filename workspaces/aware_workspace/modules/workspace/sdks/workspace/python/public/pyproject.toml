[project]
name = "aware-workspace-sdk"
version = "0.2.1"
description = "Neutral Workspace SDK with explicitly selected original authority providers."
license = "Apache-2.0"
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-workspace-runtime>=0.2.1,<0.3.0",
]

[project.optional-dependencies]
preparation = ["aware-workspace-fs-adapter>=0.1.1,<0.2.0"]
filesystem = ["aware-workspace-fs-adapter>=0.1.0,<0.2.0"]
filesystem_delta_retention = ["aware-workspace-fs-adapter>=0.1.0,<0.2.0"]
publication = [
  "aware-workspace-runtime[publication]>=0.2.0,<0.3.0",
  "aware-workspace-fs-adapter>=0.1.0,<0.2.0",
  "aware-issue-sdk>=0.10.2,<0.11.0",
]
test = [
  "flake8>=7.1.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[tool.uv.sources]
aware-workspace-runtime = { workspace = true }
aware-workspace-fs-adapter = { workspace = true }

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_workspace_sdk"]
include = ["README.md", "aware_workspace_sdk/py.typed"]
