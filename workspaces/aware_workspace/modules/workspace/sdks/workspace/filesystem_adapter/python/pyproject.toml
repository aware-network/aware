[project]
name = "aware-workspace-fs-adapter"
version = "0.1.11"
description = "Original Workspace filesystem publication and retained-store authority providers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AWARE Team" }]
dependencies = [
  "aware-file-system>=0.3.8,<0.4.0",
  "aware-workspace-runtime>=0.2.18,<0.3.0",
  "aware-workspace-sdk>=0.2.13,<0.3.0",
  "pydantic>=2.8.2,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_workspace_fs_adapter"]
include = ["README.md", "aware_workspace_fs_adapter/py.typed"]
