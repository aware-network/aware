aware = 1

[seed]
id = "aware-kernel"
version = 1
title = "Aware Kernel Seed (v0)"
description = "Genesis seed for the Aware network kernel: provider organization + executor agents."

[kernel]
# Optional. If omitted/empty, the node resolves the kernel env config id from:
# - AWARE_NODE_KERNEL_ENVIRONMENT_CONFIG_ID (recommended), or
# - AWARE_NODE_ENVIRONMENT_CONFIG_MANIFESTS (single manifest path).
environment_config_id = ""

[system]
# System identity (OS-plane author). Used for node-owned operations such as kernel boot,
# migrations, and replication.
#
# NOTE: Only public key is stored here. Private key must be resolved from node secrets/state.
key_label = "aware-system"
public_key = "ed25519:0e60bc31fac4bacf0bb62a6f8bcf1eaf0168f1b23c9fc1cf0ab70e990c4a3246"

[organization]
# Provider organization identity (seller of services).
#
# NOTE: Only public key is stored here. Private key must be resolved from node secrets/state.
key_label = "aware-org"
public_key = "ed25519:48f334a378c300be97b00c1066d34b469ef378bacf886830b6569f3399ecfff8"

[[executors]]
# Executor agent identities (runtime workers). Multi-agent by default.
# These identities will be added as members of the provider org (role defaults to "member").
key_label = "aware-inference-executor"
public_key = "ed25519:d2c4657e1eac121afe3431ba8c8785e059241f5461d61431c70f095ac4ff8b1f"
role = "member"

[service]
# Canonical Service stable-id inputs. Economy consumes lower-level primitives only.
service_config_name = "Aware Catalog"
inference_service_name = "Aware Inference"

[economy]
# Economy primitive seed inputs.
smart_contract_config_name = "AwareMembership"
smart_contract_type = "utility"
smart_contract_address = "dev:membership"
