[project]
name = "aware-repository-fs-adapter"
version = "0.1.0a1"
description = "Explicit local filesystem repository preparation provider."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["aware-repository-sdk==0.1.0a1"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_repository_fs_adapter"]
