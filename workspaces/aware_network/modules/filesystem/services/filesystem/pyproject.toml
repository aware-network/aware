[project]
name = "aware-file-system-service"
version = "0.1.0"
description = "Canonical FileSystem service package for DTO-based local observation, delta, apply, and backend capability adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-file-system",
  "aware_file_system_service_api",
  "aware_file_system_service_dto",
  "aware_file_system_service_protocol",
  "aware-service-runtime",
  "aware-service-service",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_file_system_service"]
include = [
  "aware_file_system_service/py.typed",
]

[tool.aware.tests]
requires_module = "file_system"
