[project]
name = "aware-memory-service"
version = "0.1.0"
description = "Canonical Memory service package for actor-scoped working-memory operations."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-memory",
  "aware-environment-sdk",
  "aware_environment_service_dto",
  "aware_memory_service_dto",
  "aware_memory_service_api",
  "aware_memory_service_protocol",
  "aware_attention_service_api",
  "aware_attention_service_dto",
  "aware-service-runtime",
  "aware-service-service",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2", "pytest-asyncio>=0.23.7"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_memory_service"]
include = [
  "aware_memory_service/py.typed",
]

[tool.aware.tests]
requires_module = "memory"
