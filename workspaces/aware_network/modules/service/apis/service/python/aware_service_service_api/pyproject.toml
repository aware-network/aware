[project]
name = "aware_service_service_api"
version = "0.1.0"
description = "Canonical API boundary for Service operation DTO ownership and future service-control capabilities."
authors = [{ name = "Aware Automations" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aware_service_service_dto",
    "aware-api-client",
    "aware-types",
    "aware-utils",
    "pydantic>=2.13.4,<3.0.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_service_service_api"]
include = ["README.md", "aware_service_service_api/py.typed"]
