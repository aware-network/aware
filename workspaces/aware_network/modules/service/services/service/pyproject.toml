[project]
name = "aware-service-service"
version = "0.1.0"
description = "AWARE Service host"
authors = [
  { name = "AWARE Team", email = "info@aware-network.org" },
]
requires-python = ">=3.12"
dependencies = [
  "aware-api-client",
  "aware-economy-providers",
  "aware-economy-sdk",
  "aware-economy-ontology",
  "aware-environment-sdk",
  "aware-experience-sdk",
  "aware_experience_service_api",
  "aware_experience_service_dto",
  "aware-meta-service",
  "aware-meta-sdk",
  "aware_environment_service_api",
  "aware_environment_service_dto",
  "aware_environment_service_protocol",
  "aware-service-runtime",
  "aware_service_service_dto",
  "aware_service_service_protocol",
  "aware-utils",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_service_service"]

[tool.aware.tests]
requires_module = "service"
