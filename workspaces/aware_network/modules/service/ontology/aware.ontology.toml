aware_ontology = 1

[ontology]
package_name = "service-ontology"
fqn_prefix = "aware_service"
version_number = 1
title = "Service"
description = "SSOT canonical (.aware) sources for service."
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-service-runtime"
import_root = "aware_service_runtime"

[semantic_contract]
provider_key = "aware_service"
role = "aware_service.provider"
module = "aware_service_runtime.semantic_contract"
owns_manifest_kinds = ["aware_service_toml"]
capabilities = ["semantic_analysis", "diagnostics", "semantic_tokens", "materialize"]

[[dependencies]]
package_name = "api-ontology"

[[dependencies]]
package_name = "code-ontology"

[[dependencies]]
package_name = "meta-ontology"

[[dependencies]]
package_name = "ontology-ontology"

[[dependencies]]
package_name = "economy-ontology"

[[dependencies]]
package_name = "experience-ontology"

[[dependencies]]
package_name = "identity-ontology"
