[project]
name = "aware-code-experience"
version = "0.1.0"
description = "Code-owned selector and editor view contracts for service-backed Code surfaces."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_code_experience"]
include = ["aware_code_experience/py.typed"]
