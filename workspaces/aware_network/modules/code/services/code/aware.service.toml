aware_service = 1

[service]
package_name = "aware-code-service"
fqn_prefix = "aware_code_service"
version_number = 1
title = "Aware Code Service"
description = "Local service adapter over the generated Code Service API semantic contract protocol."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "service_ontology"

[host]
service_surface = "service"
activation_mode = "materialize_and_load_committed"
materialize_on_start = true

[implementation]

[[implementation.packages]]
package_name = "aware-code-service"
language = "python"
import_root = "aware_code_service"
manifest_path = "pyproject.toml"
package_root = "."
entrypoint = "aware_code_service.service_bindings:build_service_bindings"
role = "service_bindings"

[[dependencies]]
package_name = "code-service-api"
version_number = 1
kind = "api_service_protocol"

[[ontology_packages]]
package_name = "code-ontology"
fqn_prefix = "aware_code"
role = "replica"
requirement_mode = "required"
description = "Code service reads committed CodePackage/Code truth from the Service-owned replica ORM session for Code view hydration."

[[ontology_packages]]
package_name = "content-ontology"
fqn_prefix = "aware_content"
role = "replica"
requirement_mode = "required"
description = "Code service reads committed ContentPartText source text from the Service-owned replica ORM session for Code editor view hydration."
