[project]
name = "aware-ontology-service"
version = "0.1.0"
description = "Canonical Ontology service package for generated API and service protocol adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-meta",
  "aware-meta-ontology",
  "aware-meta-service",
  "aware_meta_service_dto",
  "aware_meta_service_protocol",
  "aware-ontology",
  "aware-ontology-ontology",
  "aware_ontology_service_api",
  "aware_ontology_service_dto",
  "aware_ontology_service_protocol",
  "aware-service-runtime",
  "aware-service-service",
  "aware-utils",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_ontology_service"]
include = [
  "aware_ontology_service/py.typed",
]

[tool.aware.tests]
requires_module = "ontology"
