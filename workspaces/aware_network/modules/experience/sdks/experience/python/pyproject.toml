[project]
name = "aware-experience-sdk"
version = "0.1.0"
description = "Experience SDK facade over the generated Experience service API."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware_environment_service_dto",
  "aware_experience_service_api",
  "aware_experience_service_dto",
  "pydantic>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
local = [
  "aware-comms",
  "aware-service-runtime",
  "aware-service-service",
  "aware-utils",
]
test = [
  "aware-sdk-core",
  "aware-comms",
  "aware-service-runtime",
  "aware-service-service",
  "aware-utils",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_experience_sdk"]
include = ["README.md", "aware_experience_sdk/py.typed"]
