[project]
name = "aware-experience-service"
version = "0.1.0"
description = "Canonical Experience service package for section-graph-binding coordination adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-experience",
  "aware_attention_service_api",
  "aware_environment_service_api",
  "aware_environment_service_dto",
  "aware_experience_service_api",
  "aware_experience_service_dto",
  "aware_experience_service_protocol",
  "aware_identity_service_api",
  "aware_identity_service_dto",
  "aware-reactivity-sdk",
  "aware_reactivity_service_api",
  "aware_reactivity_service_dto",
  "aware-service-runtime",
  "aware-service-service",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_experience_service"]
include = [
  "aware_experience_service/py.typed",
]

[tool.aware.tests]
requires_module = "experience"
