[project]
name = "aware-experience"
version = "0.1.0"
description = "Aware experience runtime module."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-code-ontology",
  "aware_environment_service_dto",
  "pydantic>=2.8.2,<3.0.0",
  "aware-experience-ontology",
  "aware_attention_service_api",
  "aware-api-runtime",
  "aware_experience_service_api",
  "aware_experience_service_dto",
  "aware-ontology",
  "aware_reactivity_service_dto",
  "aware-service-runtime",
  "aware-utils",
  "tree-sitter>=0.24.0,<0.25.0",
  "tree-sitter-aware",
  "typing-extensions>=4.10.0,<5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_experience"]
include = ["aware_experience/py.typed"]

[tool.aware.tests]
requires_module = "experience"
