[project]
name = "aware-hub-sdk"
version = "0.1.0"
description = "Handwritten Hub SDK facade over generated Hub Api Client."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware_code_service_dto",
  "aware-hub-experience",
  "aware-types",
  "aware_hub_service_api",
  "aware_hub_service_dto",
  "pydantic>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_hub_sdk"]
include = ["README.md", "aware_hub_sdk/py.typed"]
