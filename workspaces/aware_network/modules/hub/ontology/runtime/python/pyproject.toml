[project]
name = "aware-hub"
version = "0.1.0"
description = "Aware Hub runtime module."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-code-ontology",
  "aware-hub-ontology",
  "pydantic>=2.8.2,<3.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_hub"]

[tool.aware.tests]
requires_module = "hub"
