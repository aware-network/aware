[project]
name = "aware-hub-service"
version = "0.1.0"
description = "Canonical Hub service package for deployment artifact and CodePackage authority distribution."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-release",
  "aware_code_service_dto",
  "aware-service-runtime",
  "aware-service-service",
  "aware_hub_service_api",
  "aware_hub_service_dto",
  "aware_hub_service_protocol",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[project.scripts]
aware-hub-service-host = "aware_hub_service.local_host:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_hub_service"]
include = [
  "aware_hub_service/py.typed",
]
