[project]
name = "aware_external_capital_provider_service_protocol"
version = "0.1.0"
description = "Generated action-target API for provider-owned wallet-funding session actuators."
authors = [{ name = "Aware Automations" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aware_external_capital_provider_service_dto",
    "aware-utils",
    "pydantic>=2.13.4,<3.0.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_external_capital_provider_service_protocol"]
include = ["README.md", "aware_external_capital_provider_service_protocol/py.typed"]
