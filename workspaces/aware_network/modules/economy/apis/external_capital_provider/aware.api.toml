aware_api = 1

[api]
package_name = "external-capital-provider-service-api"
fqn_prefix = "aware_external_capital_provider_service_api"
version_number = 1
title = "External Capital Provider Service API"
description = "Generated action-target API for provider-owned wallet-funding session actuators."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "api_ontology"

[targets.python]
root_dir = "python"

[targets.python.public_package]
package_dir = "aware_external_capital_provider_service_api"

[targets.python.service_protocol]
package_dir = "aware_external_capital_provider_service_protocol"

[[dependencies]]
package_name = "external-capital-provider-service-dto"

[[semantic_package_exports]]
kind = "api_dto"
package_name = "external-capital-provider-service-dto"
manifest_path = "dto/aware.toml"
