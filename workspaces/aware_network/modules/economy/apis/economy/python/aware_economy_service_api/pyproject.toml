[project]
name = "aware_economy_service_api"
version = "0.1.0"
description = "Public generated API client and service protocol boundary for the first canonical Economy service protocol rail."
authors = [{ name = "Aware Automations" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aware_economy_service_dto",
    "aware-api-client",
    "aware-types",
    "aware-utils",
    "pydantic>=2.13.4,<3.0.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_economy_service_api"]
include = ["README.md", "aware_economy_service_api/py.typed"]
