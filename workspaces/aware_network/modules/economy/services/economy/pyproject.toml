[project]
name = "aware-economy-service"
version = "0.1.0"
description = "Canonical Economy service package for generated API and service protocol adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-api-ontology",
  "aware-economy",
  "aware-economy-ontology",
  "aware_economy_service_api",
  "aware_economy_service_protocol",
  "aware_identity_service_api",
  "aware-orm",
  "aware-service-ontology",
  "aware-service-runtime",
  "aware-service-service",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_economy_service"]
include = [
  "aware_economy_service/py.typed",
]

[tool.aware.tests]
requires_module = "economy"
