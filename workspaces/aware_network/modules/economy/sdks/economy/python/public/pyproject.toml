[project]
name = "aware-economy-sdk"
version = "0.1.0"
description = "Economy SDK facade over generated Economy API clients."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-api-client",
  "aware_economy_service_api",
  "aware_economy_service_dto",
  "pydantic>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_economy_sdk"]
include = ["README.md", "aware_economy_sdk/py.typed"]
