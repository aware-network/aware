aware_ontology = 1

[ontology]
package_name = "economy-ontology"
fqn_prefix = "aware_economy"
version_number = 1
title = "Economy"
description = "SSOT canonical (.aware) sources for economy"
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-economy"
import_root = "aware_economy"

[semantic_contract]
provider_key = "aware_economy"
role = "aware_economy.provider"
module = "aware_economy.semantic_contract"
owns_manifest_kinds = ["aware_economy_toml"]
capabilities = ["materialize"]

[[dependencies]]
package_name = "identity-ontology"

[[dependencies]]
package_name = "code-ontology"
