[project]
name = "aware-environment-experience"
version = "0.1.0"
description = "Environment module-owned navigation experience package for Interface-mounted OS surfaces."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_environment_experience"]
include = ["aware_environment_experience/py.typed"]
