[project]
name = "aware-environment"
version = "0.1.0"
description = "Aware environment runtime module."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware_environment_service_dto",
  "aware-meta-ontology",
  "aware_meta_service_dto",
  "aware_ontology_service_dto",
  "pydantic>=2.8.2,<3.0.0",
  "aware-environment-ontology",
  "aware-identity-ontology",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_environment"]

[tool.aware.tests]
requires_module = "environment"
