aware_service = 1

[service]
package_name = "aware-environment-service"
fqn_prefix = "aware_environment_service"
version_number = 1
title = "Aware Environment Service"
description = "Canonical Environment service package over the generated Environment API service-protocol rail."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "service_ontology"

[host]
service_surface = "service"
activation_mode = "materialize_and_load_committed"
materialize_on_start = true

[host.contract]
entrypoint = "aware_environment_service.host_contract:resolve_service_host_contract"

[implementation]

[[implementation.packages]]
package_name = "aware-environment-service"
language = "python"
import_root = "aware_environment_service"
manifest_path = "pyproject.toml"
package_root = "."
entrypoint = "aware_environment_service.service_bindings:build_service_bindings"
role = "service_bindings"

[[api_provider_sets]]
key = "kernel.environment_authority.v1"
title = "Kernel Environment Authority"
membership_key = "kernel-environment-host"
description = "Kernel Environment authority service providers routed through Ontology."

[[dependencies]]
package_name = "environment-service-api"
version_number = 1
kind = "api_service_protocol"

[[dependencies]]
package_name = "ontology-service-api"
version_number = 1
kind = "api_invocation"

[[dependencies]]
package_name = "attention-service-api"
version_number = 1
kind = "api_invocation"
