[project]
name = "aware-attention-service"
version = "0.1.0"
description = "Canonical Attention service package for section focus-scope observable adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-attention",
  "aware-environment-sdk",
  "aware_environment_service_dto",
  "aware-interface-sdk",
  "aware_attention_service_dto",
  "aware_attention_service_api",
  "aware_attention_service_protocol",
  "aware-service-runtime",
  "aware-service-service",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_attention_service"]
include = [
  "aware_attention_service/py.typed",
]

[tool.aware.tests]
requires_module = "attention"
