aware_ontology = 1

[ontology]
package_name = "attention-ontology"
fqn_prefix = "aware_attention"
version_number = 1
title = "Attention"
description = "SSOT canonical (.aware) sources for attention."
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-attention"
import_root = "aware_attention"

[semantic_contract]
provider_key = "aware_attention"
role = "aware_attention.provider"
module = "aware_attention.semantic_contract"
owns_manifest_kinds = ["aware_attention_toml"]
capabilities = ["materialize"]

[[dependencies]]
package_name = "meta-ontology"

[[dependencies]]
package_name = "code-ontology"

[[dependencies]]
package_name = "identity-ontology"
