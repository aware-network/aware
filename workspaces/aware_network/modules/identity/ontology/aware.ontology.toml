aware_ontology = 1

[ontology]
package_name = "identity-ontology"
fqn_prefix = "aware_identity"
version_number = 1
title = "Identity"
description = "SSOT canonical (.aware) sources for identity."
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-identity"
import_root = "aware_identity"

[[dependencies]]
package_name = "meta-ontology"

[[dependencies]]
package_name = "reactivity-ontology"

[[dependencies]]
package_name = "storage-ontology"

[[dependencies]]
package_name = "content-ontology"

[[dependencies]]
package_name = "history-ontology"
