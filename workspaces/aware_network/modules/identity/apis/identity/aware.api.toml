aware_api = 1

[api]
package_name = "identity-service-api"
fqn_prefix = "aware_identity_service_api"
version_number = 1
title = "Identity Service API"
description = "Public Identity service API boundary for canonical Identity admission, credential profiles, and actor-role assignment over the class-instance-aware role rail."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "api_ontology"

[targets.python]
root_dir = "python"

[targets.python.public_package]
package_dir = "aware_identity_service_api"

[targets.python.service_protocol]
package_dir = "aware_identity_service_protocol"

[[dependencies]]
package_name = "identity-service-dto"

[[semantic_package_exports]]
kind = "api_dto"
package_name = "identity-service-dto"
manifest_path = "dto/aware.toml"
