aware_sdk = 1

[sdk]
package_name = "content-sdk"
fqn_prefix = "aware_content_sdk"
version_number = 1
title = "Content SDK"
description = "Canonical Content SDK operations over the Content service API."

[build]
sources_dir = "."
include_paths = ["*.aware"]
exclude_paths = []
force_fresh_scan = false
compilation_mode = "sdk_ontology"

[targets.python]
root_dir = "python"

[targets.python.public_package]
package_dir = "aware_content_sdk"

[[dependencies]]
kind = "api_package"
package_name = "content-service-api"
version_number = 1
