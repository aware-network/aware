aware_service = 1

[service]
package_name = "aware-content-service"
fqn_prefix = "aware_content_service"
version_number = 1
title = "Aware Content Service"
description = "Canonical Content service package over the generated Content API service-protocol rail."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "service_ontology"

[host]
service_surface = "service"
activation_mode = "materialize_and_load_committed"
materialize_on_start = true

[implementation]

[[implementation.packages]]
package_name = "aware-content-service"
language = "python"
import_root = "aware_content_service"
manifest_path = "pyproject.toml"
package_root = "."
entrypoint = "aware_content_service.service_bindings:build_service_bindings"
role = "service_bindings"

[[dependencies]]
package_name = "content-service-api"
version_number = 1
kind = "api_service_protocol"
