[project]
name = "aware-content-service"
version = "0.1.0"
description = "Aware Content service package over generated Content Service API."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aware-content",
  "aware-content-ontology",
  "aware_content_service_api",
  "aware_content_service_dto",
  "aware_content_service_protocol",
  "aware-service-runtime",
  "aware-types",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_content_service"]
include = ["README.md", "aware_content_service/py.typed"]

[tool.aware.tests]
requires_module = "content"
