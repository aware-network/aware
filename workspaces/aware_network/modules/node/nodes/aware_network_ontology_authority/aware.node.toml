aware_node = 1

[node]
package_name = "aware-network-ontology-authority-node"
fqn_prefix = "aware_network_ontology_authority_node"
title = "Aware Network Ontology Authority Node"
description = "Aware Network ontology authority node package for WorkspaceRevision-backed kernel and network ontology publication."

[build]
sources_dir = "nodes"
include_paths = ["**/*.aware"]
exclude_paths = []
compilation_mode = "node_ontology"

