aware_ontology = 1

[ontology]
package_name = "node-ontology"
fqn_prefix = "aware_node"
version_number = 1
title = "Node"
description = "SSOT canonical (.aware) sources for hosted node composition"
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-node"
import_root = "aware_node"

[semantic_contract]
provider_key = "aware_node"
role = "aware_node.provider"
module = "aware_node.semantic_contract"
owns_manifest_kinds = ["aware_node_toml"]
capabilities = ["semantic_analysis", "materialize"]

[[dependencies]]
package_name = "service-ontology"

[[dependencies]]
package_name = "interface-ontology"

[[dependencies]]
package_name = "ontology-ontology"

[[dependencies]]
package_name = "code-ontology"

[[dependencies]]
package_name = "environment-ontology"
