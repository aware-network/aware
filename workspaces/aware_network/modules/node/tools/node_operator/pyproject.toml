[project]
name = "aware-node-operator"
version = "0.1.0"
description = "Local operator helpers for preparing and applying AWARE Node package runs."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-experience",
  "aware-node-service",
  "aware_node_service_dto",
  "aware-service-runtime",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_node_operator"]
