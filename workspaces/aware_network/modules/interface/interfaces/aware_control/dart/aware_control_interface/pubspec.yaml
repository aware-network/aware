name: aware_control_interface
description: Bootstrap aware_control interface Dart package for shared Aware Shell mounting.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  aware_shell:
    path: ../../../../libs/shell/dart/aware_shell
  aware_pane_runtime:
    path: ../../../../libs/pane_runtime/dart/aware_pane_runtime
  aware_content_render_components:
