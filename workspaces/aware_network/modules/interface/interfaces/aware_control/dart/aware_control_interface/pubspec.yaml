    path: ../../../../../network/interfaces/panes/network_territory/dart/aware_network_territory_pane
  aware_hub_service_api:
    path: ../../../../../hub/apis/hub/dart/aware_hub_service_api
  aware_network_service_api:
    path: ../../../../../network/apis/network/dart/aware_network_service_api

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  lints: ^5.1.1

flutter:
  uses-material-design: true
