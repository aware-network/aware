version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  uuid: ^4.5.1
  logging: ^1.2.0
  path: ^1.9.0
  sqflite_common_ffi: ^2.3.7

  aware_api:
