  aware_interface_service_api:
    path: ../../../../apis/interface/dart/aware_interface_service_api
  aware_interface_sdk:
    path: ../../../../sdks/interface/dart/aware_interface_sdk
  aware_environment_service_api:
    path: ../../../../../environment/apis/environment/dart/aware_environment_service_api
  aware_pane_runtime:
    path: ../../../pane_runtime/dart/aware_pane_runtime
