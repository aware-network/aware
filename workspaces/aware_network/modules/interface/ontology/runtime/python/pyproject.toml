[project]
name = "aware-interface"
version = "0.1.0"
description = ""
authors = [
  { name = "Luis Lechuga", email = "luis@aware.run" },
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.2,<3.0.0",
  "aware_environment_service_dto",
  "aware-interface-sdk",
  "aware_interface_service_dto",
  "aware-environment",
  "aware-network",
  "aware-identity",
  "aware-attention-ontology",
  "aware-code-ontology",
  "aware-experience",
  "aware-experience-ontology",
  "aware-history-ontology",
  "aware-interface-ontology",
  "aware-orm",
  "aware-meta",
  "aware-grammar",
  "aware-meta-ontology",
  "aware-identity-ontology",
  "aware-network-ontology",
]

[project.entry-points."aware_cli.command_packs"]
session = "aware_interface.cli.pack:get_command_specs"

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = "E266"

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_interface"]
include = ["aware_interface/py.typed"]

[tool.aware.tests]
requires_module = "interface"
