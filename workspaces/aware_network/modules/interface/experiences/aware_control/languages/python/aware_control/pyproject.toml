[project]
name = "aware-control"
version = "0.1.0"
description = "Minimal bootstrap control experience for Identity, Hub, Workspace, Interface mount, and Node session panes."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_control"]
include = ["aware_control/py.typed"]
