version = 2
id = "graph_os_linux_cli"
description = "Graph-OS Linux CLI bundle roots for module and environment compile."
default_platform = "linux-x86_64"
vendor_dependencies = true
python_runtime_mode = "managed_venv"

capabilities = [
  "runtime",
  "python",
  "sql",
]

packages = [
  "aware-cli",
]

kernel_source_paths = [
  "workspaces/aware_kernel/modules/meta/ontology/structure",
  "workspaces/aware_kernel/modules/code/ontology/structure",
  "workspaces/aware_kernel/modules/storage/ontology/structure",
  "workspaces/aware_kernel/modules/history/ontology/structure",
  "workspaces/aware_kernel/modules/content/ontology/structure",
  "modules/api/structure/ontology",
  "workspaces/aware_workspace/modules/workspace/structure/ontology",
  "modules/interface/structure/ontology",
  "workspaces/aware_network/modules/experience/ontology/structure",
]

required_packages = [
  "aware-cli",
  "aware-release",
  "aware-utils",
  "aware-environment-artifacts",
  "aware-code",
  "aware-meta",
  "aware-storage",
  "aware-runtime",
  "aware-orm",
  "aware-content",
  "aware-file-system",
  "aware-language-service",
  "aware-workspace",
  "aware-code-api",
  "aware-history-api",
  "aware-meta-api",
  "aware-code-ontology",
  "aware-content-ontology",
  "aware-history",
  "aware-history-ontology",
  "aware-meta-ontology",
  "aware-storage-ontology",
  "aware-grammar",
  "sql-grammar",
  "python-grammar",
  "dart-grammar",
]

audit_packages = [
  "aware-environment-artifacts",
  "aware-meta",
  "aware-code",
]
