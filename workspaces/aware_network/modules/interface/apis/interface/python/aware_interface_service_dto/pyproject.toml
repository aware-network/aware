[project]
name = "aware_interface_service_dto"
version = "0.1.0"
description = "Generated API DTO package for interface-service-dto."
authors = [{ name = "Aware Automations" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aware-api-ontology",
    "aware-attention-ontology",
    "aware-code-ontology",
    "aware-content-ontology",
    "aware-economy-ontology",
    "aware-environment-ontology",
    "aware-experience-ontology",
    "aware-history-ontology",
    "aware-identity-ontology",
    "aware-interface-ontology",
    "aware-meta-ontology",
    "aware-network-ontology",
    "aware-ontology-ontology",
    "aware-reactivity-ontology",
    "aware-sdk-ontology",
    "aware-service-ontology",
    "aware-storage-ontology",
    "aware_attention_service_dto",
    "aware_environment_service_dto",
    "aware_experience_service_dto",
    "aware_identity_service_dto",
    "aware_meta_service_dto",
    "aware-types",
    "aware-utils",
    "pydantic>=2.13.4,<3.0.0"
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_interface_service_dto"]
include = ["README.md", "aware_interface_service_dto/py.typed"]
