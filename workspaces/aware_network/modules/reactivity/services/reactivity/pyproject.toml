[project]
name = "aware-reactivity-service"
version = "0.1.0"
description = "Canonical Reactivity service package for event dispatch and action lifecycle streams."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-api-client",
  "aware_environment_service_dto",
  "aware_environment_service_api",
  "aware_identity_service_api",
  "aware-reactivity",
  "aware-service-runtime",
  "aware-service-service",
  "aware_reactivity_service_dto",
  "aware_reactivity_service_protocol",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_reactivity_service"]
include = [
  "aware_reactivity_service/py.typed",
]
