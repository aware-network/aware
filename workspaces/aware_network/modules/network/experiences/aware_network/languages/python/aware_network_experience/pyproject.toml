[project]
name = "aware-network-experience"
version = "0.1.0"
description = "Network territory discovery experience package for Control ingress surfaces."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_network_experience"]
include = ["aware_network_experience/py.typed"]
