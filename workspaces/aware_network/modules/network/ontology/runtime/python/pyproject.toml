[project]
name = "aware-network"
version = "0.1.0"
description = "Aware Network"
authors = [
  { name = "Luis Lechuga", email = "luis@aware.run" },
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.2,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "aiohttp>=3.11.11,<4.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "aware_environment_service_dto",
  "aware_network_service_dto",
  "aware-environment",
]

[tool.black]
line-length = 120
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = "E266"

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_network"]

[tool.aware.tests]
requires_module = "network"
