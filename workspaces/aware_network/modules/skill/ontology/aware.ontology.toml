aware_ontology = 1

[ontology]
package_name = "skill-ontology"
fqn_prefix = "aware_skill"
version_number = 1
title = "Skill Ontology"
description = "Canonical Skill module for API-backed reusable capability instructions."
source_manifest = "structure/aware.toml"
package_root = "."
sources_root = "structure/aware"
stable_ids_ownership = "compiler"
stable_ids_parity_policy = "error"
stable_ids_resolution_policy = "class_strict"

[layout]
profile = "ontology_structure_v1"

[runtime]
manifest = "runtime/python/pyproject.toml"
project_name = "aware-skill"
import_root = "aware_skill"

[semantic_contract]
provider_key = "aware_skill"
role = "aware_skill.provider"
module = "aware_skill.semantic_contract"
owns_manifest_kinds = ["aware_skill_toml"]
capabilities = ["semantic_analysis", "diagnostics", "semantic_tokens", "materialize"]

[[dependencies]]
package_name = "api-ontology"

[[dependencies]]
package_name = "code-ontology"

[[dependencies]]
package_name = "experience-ontology"

[[dependencies]]
package_name = "meta-ontology"
