aware_experience = 1

[experience]
package_name = "aware-meta-experience"
fqn_prefix = "aware_meta_experience"
version_number = 1
title = "Aware Meta"
description = "General Meta graph canvas experience contracts for Interface-mounted graph views."

[build]
environment_handle = "kernel"
sources_dir = "."
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true

[[dependencies]]
package_name = "aware_meta_graph_attention"
kind = "attention_package"

[targets.dart]
root_dir = "languages/dart"
package_dir = "aware_meta_experience"

[targets.python]
root_dir = "languages/python"
package_dir = "aware_meta_experience"
