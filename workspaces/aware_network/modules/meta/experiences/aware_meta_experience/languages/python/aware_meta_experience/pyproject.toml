[project]
name = "aware-meta-experience"
version = "0.1.0"
description = "General Meta graph canvas experience contracts for Interface-mounted graph views."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8.0,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_meta_experience"]
include = ["aware_meta_experience/py.typed"]
