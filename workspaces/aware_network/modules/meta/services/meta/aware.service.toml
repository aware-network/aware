aware_service = 1

[service]
package_name = "aware-meta-service"
fqn_prefix = "aware_meta_service"
version_number = 1
title = "Aware Meta Service"
description = "Canonical Meta service package for Graph-OS commit authority over the generated service protocol."

[build]
sources_dir = "bindings"
include_paths = ["**/*.aware"]
exclude_paths = []
force_fresh_scan = true
compilation_mode = "service_ontology"

[host]
service_surface = "service"
activation_mode = "materialize_and_load_committed"
materialize_on_start = true

[implementation]

[[implementation.packages]]
package_name = "aware-meta-service"
language = "python"
import_root = "aware_meta_service"
manifest_path = "pyproject.toml"
package_root = "."
entrypoint = "aware_meta_service.service_bindings:build_service_bindings"
role = "service_bindings"

[[api_provider_sets]]
key = "kernel.environment_authority.v1"
title = "Kernel Environment Authority"
membership_key = "kernel-environment-host"
description = "Kernel environment and Meta authority service providers."

[[dependencies]]
package_name = "meta-service-api"
version_number = 1
kind = "api_service_protocol"

[[object_config_graph_packages]]
manifest = "db/aware.toml"
role = "temporal_session_state"
description = "Meta service-owned temporal mutation session/frame/tombstone local state."
