[project]
name = "aware-meta-service"
version = "0.1.0"
description = "Canonical Meta service package for generated API and service protocol adapters."
authors = [{ name = "AWARE Team" }]
requires-python = ">=3.12"
dependencies = [
  "aware-api-client",
  "aware-code",
  "aware-meta",
  "aware-meta-experience",
  "aware-meta-ontology",
  "aware-meta-sdk",
  "aware_meta_service_api",
  "aware_meta_service_dto",
  "aware_meta_service_protocol",
  "aware-orm",
  "aware-service-runtime",
  "aware-service-service-dto",
  "aware-utils",
  "asyncpg>=0.30.0,<0.31.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_meta_service"]
include = [
  "aware_meta_service/py.typed",
]

[tool.aware.tests]
requires_module = "meta"
