[project]
name = "aware-command-runtime"
version = "0.1.1"
description = "Small command composition runtime for Aware SDK CLIs."
authors = [{ name = "AWARE Team" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_command_runtime"]
include = ["README.md", "aware_command_runtime/py.typed"]
