[project]
name = "aware-file-system"
version = "0.3.3"
description = "Neutral filesystem observation, retained mutation and package publication mechanisms for Aware tooling."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "AWARE Team" }
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: System :: Filesystems",
]
keywords = ["aware", "filesystem", "watcher", "automation"]
dependencies = [
  "pyyaml>=6.0.2,<7.0.0",
  "msgpack>=1.1.1,<2.0.0",
  "pathspec>=1.1.1,<2.0.0",
  "pydantic>=2.8.2,<3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4.2",
  "pytest-asyncio>=0.23.7",
]

[project.urls]
Homepage = "https://github.com/aware-network/aware"
Source = "https://github.com/aware-network/aware"
Documentation = "https://github.com/aware-network/aware/blob/main/README.md"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_file_system"]
include = [
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "aware_file_system/py.typed",
]
