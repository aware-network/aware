[project]
name = "aware-ontology-object-facade-client"
version = "0.1.0"
description = "Detached Ontology facade wire data and strict framing codecs."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AWARE Team" }]
dependencies = ["aware-meta-type-schema>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_ontology_object_facade_client"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
enable-by-default = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../../../meta/libs/type_schema/python"]

[tool.pyright]
include = ["aware_ontology_object_facade_client", "tests"]
typeCheckingMode = "standard"

extraPaths = ["../../../../meta/libs/type_schema/python"]
