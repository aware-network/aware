[project]
name = "aware-protocol-runtime"
version = "0.1.1"
description = "Dependency-free canonical contracts for Aware Protocol manifests and targets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_protocol_runtime"]
include = ["aware_protocol_runtime/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
