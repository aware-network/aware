[project]
name = "aware-protocol-fs-adapter"
version = "0.2.0"
description = "Strict filesystem adapter for aware.protocol.toml manifests."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "aware-protocol-runtime>=0.1.0",
  "aware-protocol-sdk>=0.1.0",
  "jsonschema>=4.23.0,<5.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_protocol_fs_adapter"]
include = [
  "aware_protocol_fs_adapter/py.typed",
  "aware_protocol_fs_adapter/schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
aware-protocol-runtime = { workspace = true }
aware-protocol-sdk = { workspace = true }
