[project]
license = "Apache-2.0"
name = "aware-code-package-delta-contract"
version = "0.1.0"
description = "Dependency-free portable CodePackageDelta value contract."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_code_package_delta_contract"]
include = ["aware_code_package_delta_contract/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
