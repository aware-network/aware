[project]
license = "Apache-2.0"
name = "aware-code-retained-registry-policy-runtime"
version = "0.1.0"
description = "Neutral fixed retained registry policy calculation; no host authority."
requires-python = ">=3.12"
dependencies = [
  "aware-code-module-manifest-contract-runtime==0.1.0",
  "aware-code-semantic-contract-runtime==0.1.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_code_retained_registry_policy_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
