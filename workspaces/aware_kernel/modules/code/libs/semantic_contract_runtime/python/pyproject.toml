[project]
license = "Apache-2.0"
name = "aware-code-semantic-contract-runtime"
version = "0.1.0"
description = "Dependency-free semantic provider/profile execution runtime for Aware Code."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "AWARE Team" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4.2,<10.0.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_code_semantic_contract_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
