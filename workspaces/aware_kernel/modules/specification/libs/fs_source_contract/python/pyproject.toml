[project]
name = "aware-specification-fs-source-contract"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "Portable filesystem source evidence for Aware Specifications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "basedpyright>=1.39.10,<2.0.0",
  "pytest>=8.4.2,<10.0.0",
  "ruff>=0.16.5,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_specification_fs_source_contract"]
include = ["aware_specification_fs_source_contract/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["aware_specification_fs_source_contract", "tests"]
executionEnvironments = [
  { root = ".", extraPaths = ["."] },
]
reportImplicitRelativeImport = "none"
reportPrivateUsage = "none"

[tool.uv]
package = true
