aware_repo = 1

[repo]
handle = "aware"
workspaces_dir = "workspaces"

[licensing]
default_spdx_expression = "Apache-2.0"
license_path = "LICENSE"
notice_path = "NOTICE"
third_party_notices_path = "THIRD_PARTY_NOTICES.md"
generated_output_policy_path = "docs/legal/GENERATED_OUTPUT_POLICY.md"
artifact_provenance_path = "docs/legal/ARTIFACT_PROVENANCE.toml"
contribution_policy_path = "CONTRIBUTING.md"
security_policy_path = "SECURITY.md"

[[workspaces]]
handle = "aware_kernel"
path = "aware_kernel"

[[workspaces]]
handle = "aware_network"
path = "aware_network"

[[repository_files]]
role = "readme"
source_path = "README.md"
target_path = "README.md"

[[repository_files]]
role = "license"
source_path = "LICENSE"
target_path = "LICENSE"

[[repository_files]]
role = "notice"
source_path = "NOTICE"
target_path = "NOTICE"

[[repository_files]]
role = "third_party_notices"
source_path = "THIRD_PARTY_NOTICES.md"
target_path = "THIRD_PARTY_NOTICES.md"

[[repository_files]]
role = "contribution_policy"
source_path = "CONTRIBUTING.md"
target_path = "CONTRIBUTING.md"

[[repository_files]]
role = "security_policy"
source_path = "SECURITY.md"
target_path = "SECURITY.md"

[[repository_files]]
role = "open_source_policy"
source_path = "docs/legal/OPEN_SOURCE_POLICY.md"
target_path = "docs/legal/OPEN_SOURCE_POLICY.md"

[[repository_files]]
role = "generated_output_policy"
source_path = "docs/legal/GENERATED_OUTPUT_POLICY.md"
target_path = "docs/legal/GENERATED_OUTPUT_POLICY.md"

[[repository_files]]
role = "artifact_provenance"
source_path = "docs/legal/ARTIFACT_PROVENANCE.toml"
target_path = "docs/legal/ARTIFACT_PROVENANCE.toml"

[[repository_files]]
role = "agent_coordination_surface:AGENTS.md"
source_path = "AGENTS.md"
target_path = "AGENTS.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:alignment_protocol"
source_path = "docs/alignment/PROTOCOL.md"
target_path = "docs/alignment/PROTOCOL.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:alignment_readme"
source_path = "docs/alignment/README.md"
target_path = "docs/alignment/README.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:alignment_current"
source_path = "docs/alignment/PUBLIC.md"
target_path = "docs/alignment/CURRENT.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:issues_protocol"
source_path = "docs/issues/PROTOCOL.md"
target_path = "docs/issues/PROTOCOL.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:feed_protocol"
source_path = "docs/feed/PROTOCOL.md"
target_path = "docs/feed/PROTOCOL.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:goals_protocol"
source_path = "docs/goals/PROTOCOL.md"
target_path = "docs/goals/PROTOCOL.md"
overlay = "agent_coordination_surface"

[[repository_files]]
role = "agent_coordination_surface:specs_protocol"
source_path = "docs/specs/PROTOCOL.md"
target_path = "docs/specs/PROTOCOL.md"
overlay = "agent_coordination_surface"

[[semantic_contract_profile_sets]]
key = "network.default"
profile_refs = ["workspace://aware_kernel#kernel.default"]
default_for = ["aware_network"]

[[checkout_profile_sets]]
key = "public_kernel"
workspace_handles = ["aware_kernel"]

[[checkout_profile_sets]]
key = "agentic_public_workspace"
workspace_handles = ["aware_kernel", "aware_network"]
