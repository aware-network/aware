[project]
name = "aware-agent-cli"
version = "0.1.0a2"
description = "Agent-first filesystem workflows over Aware's canonical Issue SDK and Git owner."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["aware-issue-cli==0.6.0a1", "aware-issue-sdk==0.7.0a1", "aware-protocol-fs-adapter==0.2.0"]

[project.scripts]
aware = "aware_agent_cli.main:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aware_agent_cli"]
